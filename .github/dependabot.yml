version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      geospatial:
        patterns: ["rasterio", "geopandas", "shapely", "pyproj", "exactextract", "pyogrio"]
      pysal:
        patterns: ["libpysal", "spreg", "esda"]
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # SvelteKit 3 declares typescript ^6 as a peer dependency.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node LTS used in CI (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*", "vite"]
      testing:
        patterns: ["vitest", "@playwright/test", "@axe-core/playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
