name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: House style and README numbers
        run: |
          uv run python scripts/check_style.py
          uv run python scripts/readme_results.py check
      - name: Tests (unit and offline end-to-end)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build the offline fixture data bundle
        run: |
          uv sync --locked
          uv run python scripts/build_fixture_bundle.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Check, lint and unit tests
        working-directory: web
        run: |
          npm run check
          npm run lint
          npm test
      - name: End-to-end and accessibility tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
