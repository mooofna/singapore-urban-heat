[project]
name = "sgheat"
version = "1.0.0"
description = "Surface urban heat in Singapore from every clear Landsat 8 and 9 scene since 2013, with spatial econometrics and a static web explorer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maurice Heide" }]
requires-python = ">=3.12"
keywords = ["urban heat island", "land surface temperature", "landsat", "remote sensing", "spatial econometrics", "singapore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "esda>=2.10.0",
    "exactextract>=0.3.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "libpysal>=4.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "planetary-computer>=1.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "spreg>=1.9.1",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/mooofna/singapore-urban-heat"
Issues = "https://github.com/mooofna/singapore-urban-heat/issues"

[project.scripts]
sgheat = "sgheat.cli.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgheat"]

[tool.hatch.build.targets.sdist]
include = ["src/sgheat", "tests", "configs", "docs/methodology.md", "README.md", "LICENSE", "DATA_LICENSE.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "NPY", "PD", "PT", "RET", "TID", "PTH", "PL", "D"]
ignore = [
    "D100", "D102", "D104", "D105", "D107", "D203", "D213",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "PD008", "PD010", "PD011", "PD013",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]
"scripts/**" = ["D", "E501"]  # prose templates for release notes and the README

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src/sgheat"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "libpysal.*", "spreg.*", "esda.*", "exactextract.*", "odc.*", "planetary_computer.*",
    "pystac_client.*", "pystac.*", "rasterio.*", "affine.*", "geopandas.*", "shapely.*",
    "pyproj.*", "scipy.*", "pyogrio.*", "xarray.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: needs internet access to upstream APIs (deselected by default)",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::FutureWarning:sgheat.*"]

[tool.coverage.run]
source = ["sgheat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
